# 本地 IAM/ITSM 桩的同源入口。
# iframe 用相对路径访问，避免把浏览器锁死在 localhost:8081（跨机访问会被拒绝）。
location = /iam-stub {
    return 301 /iam-stub/;
}

location ^~ /iam-stub/ {
    proxy_pass http://iam-stub:8080/iam-stub/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /itsm-stub {
    return 301 /itsm-stub/;
}

location ^~ /itsm-stub/ {
    proxy_pass http://iam-stub:8080/itsm-stub/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 桩页面里的“通过/驳回”按钮调用 /stub/api/approve-group，需同源代理。
location ^~ /stub/ {
    proxy_pass http://iam-stub:8080/stub/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
